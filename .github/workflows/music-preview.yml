
name: Build music categories preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build music preview
        run: python build_music_preview.py

      - name: Upload preview playlist
        uses: actions/upload-artifact@v4
        with:
          name: music-categories-preview
          path: music-categories-preview.m3u
          if-no-files-found: error
