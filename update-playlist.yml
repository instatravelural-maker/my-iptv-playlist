name: Build IPTV playlist
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    paths:
      - 'build_playlist.py'
      - 'regional.m3u'
      - '.github/workflows/update-playlist.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version
          ffmpeg -version

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build playlist
        run: python build_playlist.py

      - name: Upload stream check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-check-report
          path: stream_check_report.csv
          if-no-files-found: warn
          retention-days: 7

      - name: Commit generated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "No playlist changes to commit."
          else
            git commit -m "Update IPTV playlist"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
